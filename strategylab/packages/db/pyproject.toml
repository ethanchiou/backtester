[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "strategylab-db"
version = "0.1.0"
description = "StrategyLab database models and repository"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
