[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "strategylab-strategies"
version = "0.1.0"
description = "StrategyLab built-in strategy examples"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
