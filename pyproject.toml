[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategylab"
version = "0.1.0"
description = "StrategyLab quantitative trading research platform"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["strategylab*"]
